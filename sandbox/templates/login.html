<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terminal Authentication - Siraugga</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-900 text-slate-300 font-sans h-screen flex flex-col justify-center items-center m-0">

    <div class="bg-slate-800/80 border border-slate-700 p-8 rounded-xl shadow-xl max-w-md w-full">
        <div class="flex items-center gap-3 mb-6">
            <div class="w-10 h-10 rounded bg-teal-900/60 border border-teal-700/50 text-teal-300 flex items-center justify-center font-bold">
                <i class="fas fa-terminal"></i>
            </div>
            <h1 class="text-2xl font-bold text-teal-400">Deploy Authentication</h1>
        </div>
        
        <p class="text-sm text-slate-400 mb-6">Enter the deployment token displayed in your terminal to authenticate this headless client session.</p>
        
        <form id="authForm" class="space-y-4">
            <div>
                <label for="tokenInput" class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Auth Token</label>
                <input type="password" id="tokenInput" required autocomplete="off"
                       class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2.5 text-slate-200 focus:outline-none focus:ring-2 focus:ring-teal-500 focus:border-transparent font-mono placeholder-slate-600"
                       placeholder="e.g. AGY-DEPLOY-XXXX">
            </div>
            <div id="errorMsg" class="hidden text-sm text-red-400 font-medium"></div>
            <div id="successMsg" class="hidden text-sm text-emerald-400 font-medium flex items-center gap-2">
                <i class="fas fa-check-circle"></i> Authenticated successfully. Returning to dashboard...
            </div>
            <button type="submit" id="submitBtn" class="w-full bg-teal-600 hover:bg-teal-500 text-white font-bold py-2.5 rounded-lg transition-colors focus:ring-4 focus:ring-teal-900">
                Authenticate Client
            </button>
        </form>
    </div>

    <script>
        document.getElementById('authForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const errorMsg = document.getElementById('errorMsg');
            const successMsg = document.getElementById('successMsg');
            const tokenInput = document.getElementById('tokenInput');
            
            errorMsg.classList.add('hidden');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Verifying...';
            
            try {
                const res = await fetch('/api/auth_submit', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token: tokenInput.value })
                });
                
                const data = await res.json();
                
                if (data.success) {
                    successMsg.classList.remove('hidden');
                    btn.classList.add('hidden');
                    tokenInput.disabled = true;
                    setTimeout(() => {
                        window.location.href = '/';
                    }, 1500);
                } else {
                    errorMsg.innerText = data.error || 'Authentication failed. Incorrect token.';
                    errorMsg.classList.remove('hidden');
                    btn.disabled = false;
                    btn.innerText = 'Authenticate Client';
                }
            } catch (err) {
                errorMsg.innerText = 'Network error contacting server.';
                errorMsg.classList.remove('hidden');
                btn.disabled = false;
                btn.innerText = 'Authenticate Client';
            }
        });
    </script>
</body>
</html>
