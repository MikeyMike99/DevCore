name = "siraugga-lab-api"
main = "server_worker.js"
compatibility_date = "2025-09-01"
workers_dev = false

# Its own address so it can never clash with joshy-api on api.mikeytech.dev.
routes = [
  { pattern = "lab.mikeytech.dev", custom_domain = true }
]

# Same D1 database JOSHY uses (new table lab_progress, see lab_schema.sql).
[[d1_databases]]
binding = "DB"
database_name = "mikeytech"
database_id = "6b07aa4d-85bc-4bdb-9f2d-0eb565bf9a32"

# LAB_MASTER_SECRET is a Worker secret (wrangler secret put LAB_MASTER_SECRET) - never in this file.
