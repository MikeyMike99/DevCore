name: Deploy Siraugga Frontend to Cloudflare Pages

on:
  push:
    branches:
      - main
    paths:
      - "sandbox/templates/**"
      - "sandbox/static/**"
      - "core/ui_config.json"
      - "scripts/build_siraugga_pages.py"
      - "wrangler.jsonc"
      - ".github/workflows/deploy-cloudflare-pages.yml"
  workflow_dispatch:

concurrency:
  group: cloudflare-pages-main
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & Deploy from Git (main)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: python -m pip install --upgrade pip jinja2

      - name: Build static Cloudflare Pages bundle from Git
        run: python scripts/build_siraugga_pages.py --git-ref HEAD

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Deploy dist/ to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Cloudflare secrets not configured in GitHub Actions; skipping deploy step."
            exit 0
          fi
          npx --yes wrangler deploy
