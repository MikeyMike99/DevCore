version: '3.8'

services:
  antigravity-agent:
    build: .
    image: antigravity-zero-trust:latest
    ports:
      - "5000:5000"
    environment:
      # Inject API Keys strictly via Environment Variables
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    tmpfs:
      # RAM-Disk for scratch files
      - /app/.agent_scratch:rw,noexec,nosuid,size=256m
    read_only: true
    # Resource Quotas (Denial of Wallet / Resource Exhaustion Protection)
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    # Network Segregation (Egress filtering should be applied at the network driver layer)
    networks:
      - agent-net
    restart: unless-stopped

networks:
  agent-net:
    driver: bridge
    # In production, configure 'internal: true' and use an egress proxy 
    # to explicitly whitelist only api.gemini.com
